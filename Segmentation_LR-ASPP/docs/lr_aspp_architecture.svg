<path d="M868 372H1127" fill="none" stroke="#ced9df"/>
<text x="997" y="403" class="label" text-anchor="middle">1×1 分类卷积 64→150</text>
<text x="997" y="435" class="small" text-anchor="middle">150 × 32 × 32</text>
<path class="edge" d="M235 592 V630 H410"/>
<path class="edge" d="M642 592 V630 H450"/>
<circle cx="430" cy="630" r="18" fill="#fff" stroke="#496778" stroke-width="2"/>
<text x="430" y="638" class="op" text-anchor="middle">×</text>
<path class="edge" d="M430 649 V681"/>
<rect x="190" y="683" width="480" height="81" rx="12" fill="#fff" stroke="#9eb0bd" stroke-width="1.7"/>
<text x="430" y="712" class="label" text-anchor="middle">双线性上采样至 32×32 → 1×1 分类卷积</text>
<text x="430" y="744" class="small" text-anchor="middle">168→150 通道   ·   输出 150 × 32 × 32</text>
<path class="edge" d="M430 764 V802 H647"/>
<path class="edge" d="M997 458 V802 H687"/>
<circle cx="667" cy="802" r="18" fill="#fff" stroke="#496778" stroke-width="2"/>
<text x="667" y="810" class="op" text-anchor="middle">+</text>
<path class="edge" d="M667 821 V844"/>
<rect x="427" y="846" width="480" height="64" rx="12" fill="#e8f0f7" stroke="#839ab0" stroke-width="1.7"/>
<text x="667" y="875" class="heading" text-anchor="middle">分割 logits   ·   150 × 32 × 32</text>
<text x="667" y="898" class="small" text-anchor="middle">训练或验证时由引擎插值到标签尺寸</text>
</svg>
